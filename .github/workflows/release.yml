# RNF-032: al publicar una etiqueta `v*`, genera el ZIP portable y el instalador y crea la
# release en GitHub con ambos y sus SHA-256 (para el manifiesto de winget).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Inno Setup
        run: choco install innosetup --no-progress -y
      # Firma opcional: con los secretos SIGN_PFX (base64) y SIGN_PASSWORD, package.ps1 firma el
      # exe y el instalador antes de calcular los SHA-256; sin ellos no se firma.
      - name: Empaquetar
        env:
          SIGN_PFX: ${{ secrets.SIGN_PFX }}
          SIGN_PASSWORD: ${{ secrets.SIGN_PASSWORD }}
        shell: pwsh
        run: ./scripts/package.ps1 -BaseUrl "https://github.com/$env:GITHUB_REPOSITORY/releases/download"
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $files = (Get-ChildItem dist -File).FullName
          gh release create $env:GITHUB_REF_NAME @files --title "Rukes $env:GITHUB_REF_NAME" --generate-notes
      - name: Manifiestos de winget
        uses: actions/upload-artifact@v4
        with:
          name: winget-manifests
          path: dist/winget
