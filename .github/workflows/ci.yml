# RNF-020 / RNF-022: build, tests, clippy y fmt en cada push y PR.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formato
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Build release
        run: cargo build --release -p rukes-app
      - name: Tamaño del binario (RNF-008, ≤ 15 MB)
        shell: pwsh
        run: |
          $mb = (Get-Item target/release/rukes.exe).Length / 1MB
          "rukes.exe: {0:N1} MB" -f $mb
          if ($mb -gt 15) { throw "rukes.exe supera 15 MB" }
