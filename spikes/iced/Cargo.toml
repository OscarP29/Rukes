[package]
name = "spike-iced"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["wgpu"]
wgpu = ["iced/wgpu"]
tiny-skia = ["iced/tiny-skia"]

[dependencies]
spike-common.workspace = true
iced = { version = "0.14", default-features = false, features = ["advanced", "canvas", "thread-pool"] }
raw-window-handle = "0.6"
