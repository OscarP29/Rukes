#:schema ./config.schema.json
# Configuración de Rukes.
# Los cambios se aplican al guardar. Si hay un error, Rukes lo indica y sigue con la última
# configuración válida. Cualquier clave que borres vuelve a su valor por defecto.

[general]
# Atajo global. Modificadores: Ctrl, Alt, Shift, Win. Ej.: "Alt+Space", "Ctrl+Shift+K".
hotkey = "Alt+Space"
# Idioma: "auto" (el del sistema), "es" o "en".
language = "auto"
# Iniciar Rukes al entrar en Windows (clave Run del usuario).
start_with_windows = false
# Terminal para los comandos de shell y «abrir terminal aquí»: "wt" (Windows Terminal) o "none".
terminal = "wt"
# Tema: "system" (sigue el modo claro/oscuro de Windows), uno incluido o uno de la carpeta
# "themes" junto a este archivo. Incluidos: tokyo-night, catppuccin-latte, catppuccin-frappe,
# catppuccin-macchiato, catppuccin-mocha, gruvbox, nord, dracula, midnight (negro puro),
# rukes-light.
theme = "system"
light_theme = "catppuccin-latte"
dark_theme = "tokyo-night"

[window]
# "center", "top_center" o "bottom_center" (barra abajo, resultados hacia arriba).
position = "center"
width = 680
# Resultados visibles a la vez.
max_results = 8
hide_on_blur = true
hide_after_action = true
# Al mostrar la ventana: "clear", "keep" o "select_all".
on_show = "select_all"
# "auto" (el del tema), "mica", "acrylic" o "solid". En Windows 10 siempre es sólido.
backdrop = "auto"
# Animaciones cortas al aparecer, seleccionar y cambiar de tamaño. También se apagan si Windows
# tiene desactivadas las animaciones.
animations = true
# Panel de previsualización a la derecha (Ctrl+P lo alterna).
preview_panel = false
preview_width = 340
# Con la búsqueda vacía, mostrar una leyenda con los comandos más útiles (clic para usarlos).
hints = true
# Cuántos comandos muestra la leyenda.
hints_count = 8
# Cuáles y en qué orden: calc, files, web, shell, clip, snip, note, todo, remind, controls,
# windows, wall, workflows, http, new, help. Vacío = los de siempre.
hints_items = []

[search]
# Peso del uso frecuente/reciente frente a la coincidencia de texto (0 a 1).
frecency_weight = 0.35
frecency_half_life_days = 7.0

[plugins.apps]
enabled = true
priority = 0.0
include_path = true

# Perfiles: una app con argumentos o carpeta propios (RF-033). Descomenta para probar.
# [[plugins.apps.profiles]]
# name = "Chrome (trabajo)"
# target = "Google Chrome"          # nombre en el menú Inicio, ruta de un .exe o comando
# args = '--profile-directory="Profile 1"'
# alias = ["cw"]
#
# [[plugins.apps.profiles]]
# name = "Terminal en Proyectos"
# target = "wt.exe"
# args = "-d ."
# cwd = "~/Desktop/Proyectos"

[plugins.apps.aliases]
# alias = "Nombre de la app tal y como aparece en el menú Inicio"
# c = "Google Chrome"
# code = "Visual Studio Code"

[plugins.calc]
# Calculadora, unidades, temperaturas y fechas: "= 5 km a millas", "70 F en C", "hora en Tokio",
# "días hasta 25 dic".
enabled = true
prefix = "="
# Evaluar sin prefijo cuando la consulta parece una operación ("2+2", "20% de 340").
auto = true
# Divisas: "100 usd a eur", "50 dólares en pesos colombianos".
currency = true
# Pedir las tasas a open.er-api.com (como mucho dos veces al día). Es la única conexión a
# internet de Rukes y está desactivada por defecto; con false se usa solo la caché.
currency_online = false
# Colores: "#ff5733", "rgb(255, 87, 51)", "hsl(11, 100%, 60%)" con muestra.
colors = true

[plugins.web]
# URLs escritas directamente y búsquedas con palabra clave: "g rust lifetimes", "yt lofi".
enabled = true

[plugins.web.engines]
# palabra clave = URL con {q} en el lugar de la búsqueda. Si defines esta tabla, sustituye a la
# lista por defecto: copia las que quieras conservar.
g = "https://www.google.com/search?q={q}"
ddg = "https://duckduckgo.com/?q={q}"
yt = "https://www.youtube.com/results?search_query={q}"
gh = "https://github.com/search?q={q}"
wiki = "https://es.wikipedia.org/w/index.php?search={q}"
crate = "https://crates.io/search?q={q}"
docs = "https://docs.rs/releases/search?query={q}"

[plugins.shell]
# "> comando" lo ejecuta; "> shell:startup" o "> ms-settings:display" abre la URI.
# También activa los comandos del sistema: bloquear, suspender, apagar, reiniciar...
enabled = true
prefix = ">"
# "pwsh", "powershell", "cmd" o "nu".
shell = "pwsh"
# No cerrar la terminal al terminar el comando.
keep_open = true
# Pedir confirmación antes de apagar, reiniciar, cerrar sesión, vaciar la papelera...
confirm_system = true

[plugins.windows]
# Cambiar a una ventana abierta escribiendo su título ("win" a secas las lista todas).
enabled = true
priority = 0.0

[plugins.processes]
# "kill chrome" o "ps": procesos con RAM y CPU; Enter pide confirmación antes de terminar.
enabled = true
priority = 0.0

[plugins.generators]
# uuid, pass 16, lorem 3, ts, md5/sha1/sha256/sha512/crc32 <texto o ruta>, b64, b64d, url,
# urld, html, htmld, hex, unhex.
enabled = true
password_length = 20
password_symbols = true

[plugins.files]
# Índice propio de archivos. "f:" solo archivos, "d:" solo carpetas, ".pdf" filtra por extensión.
enabled = true
priority = -0.15
roots = ["~/Desktop", "~/Documents", "~/Downloads", "~/Pictures", "~/Videos", "~/Music"]
exclude = [
  "**/node_modules",
  "**/.git",
  "**/target",
  "**/__pycache__",
  "**/.venv",
  "**/AppData",
  "**/$RECYCLE.BIN",
]
include_hidden = false
# Caracteres mínimos para buscar archivos sin prefijo.
min_chars = 3
# Si Everything (voidtools) está abierto, buscar con él en todo el disco.
everything = true

[plugins.clipboard]
# Historial del portapapeles ("clip"): se guarda cifrado con DPAPI en
# %LOCALAPPDATA%\Rukes\clipboard. Desactivado no se escucha el portapapeles.
enabled = true
keyword = "clip"
# Elementos como mucho y días que se guardan (0 = sin caducidad). Los fijados (Ctrl+S) no
# cuentan ni caducan.
max_items = 500
expire_days = 30
# true: Enter pega en la ventana anterior. false: solo copia.
paste = true
# Nunca se guardan copias de estos programas. Tampoco el contenido que Windows marca como
# sensible (gestores de contraseñas).
exclude = [
  "keepass.exe",
  "keepassxc.exe",
  "1password.exe",
  "bitwarden.exe",
  "enpass.exe",
  "dashlane.exe",
  "lastpass.exe",
  "nordpass.exe",
  "protonpass.exe",
  "roboform.exe",
]

[plugins.snippets]
# Textos reutilizables en archivos .toml o .md. Escribe su palabra clave (o "snip" para verlos
# todos). Variables: {fecha} {hora} {portapapeles} {cursor} {campo:Nombre}.
enabled = true
keyword = "snip"
# Carpeta. Vacío = "snippets" dentro de la carpeta de configuración. Admite ~ y %VAR%.
dir = ""
# true: Enter inserta en la ventana anterior. false: solo copia.
paste = true

[plugins.notes]
# "note texto", "todo texto" y "remind 15m texto". Archivos Markdown normales (sirven en
# Obsidian). Vacío = carpeta "notes" dentro de la configuración. Admiten ~ y %VAR%.
enabled = true
notes_file = ""
todo_file = ""

[plugins.controls]
# "vol 50", "vol mute", "brillo 70", "wifi", "bluetooth", "avion", "oscuro", "claro".
enabled = true

[plugins.http]
# Mini Postman: "http 3000/api" (un número es un puerto de localhost), "post :8080/login {...}",
# "-H \"Nombre: valor\"" para cabeceras. Solo envía al pulsar Enter. "http" a secas abre el
# panel: Tab despliega cabeceras, cuerpo, auth y parámetros; ↑ ↓ recorren el historial y pegar
# una orden curl rellena todo.
enabled = true
# Atajo global que abre el mini Postman directamente (p. ej. "ctrl+alt+p"). Vacío: ninguno.
hotkey = ""

[plugins.wall]
# "wall": tus fondos de pantalla con previsualización; Enter lo pone, "wall random" elige uno.
enabled = true
keyword = "wall"
# Carpetas con imágenes (se miran también las subcarpetas). Admiten ~ y %VAR%.
dirs = ["~/Pictures/Wallpapers", "%SystemRoot%/Web/Wallpaper"]
# fill, fit, stretch, tile, center o span (una imagen para todos los monitores).
position = "fill"
# Cambiar solo cada cierto tiempo, p. ej. "30m" o "2h". Vacío = nunca.
interval = ""
# Al cambiar solo: true = al azar, false = en orden.
shuffle = true

[plugins.external]
# Plugins externos: una subcarpeta con plugin.toml por plugin (protocolo en
# docs/plugin-protocol.md). Se instalan y quitan en caliente. "plugins" los lista.
enabled = true
# Vacío = carpeta "plugins" dentro de la configuración.
dir = ""

[scripts]
# Scripts propios: cualquier archivo de la carpeta con una cabecera "@rukes.name" aparece en el
# launcher sin reiniciar. "new script" crea uno desde una plantilla y "logs" muestra el historial.
enabled = true
priority = 0.05
# Carpeta vigilada. Vacío = "scripts" dentro de la carpeta de configuración. Admite ~ y %VAR%.
dir = ""
# Editor para "new script" y Ctrl+E: comando del PATH o ruta. Si no existe, el Bloc de notas.
editor = "code"
# Tiempo máximo por script si su cabecera no dice otro ("15s", "2m"; "0" = sin límite).
default_timeout = "30s"
# Ejecuciones que se guardan en "logs".
history_size = 50

[scripts.interpreters]
# extensión = comando. .ps1, .bat, .cmd, .exe y .rhai no necesitan intérprete. Si .js no
# encuentra node, se prueban deno y bun.
py = "python"
js = "node"
ts = "deno run"
lua = "lua"

[workflows]
# Workflows ("modo trabajo") y triggers programados, en archivos .toml de la carpeta. La primera
# vez se crean ejemplos. Escribe "workflows" o "triggers" en el launcher para verlos.
enabled = true
# Carpeta. Vacío = "workflows" dentro de la carpeta de configuración. Admite ~ y %VAR%.
dir = ""
# false = los triggers no se ejecutan (también se pausan desde el icono de la bandeja).
triggers = true
