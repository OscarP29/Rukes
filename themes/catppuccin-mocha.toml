# Tema incluido en Rukes. Copia este archivo a la carpeta "themes" de tu configuración para
# modificarlo, o crea uno nuevo con extends = "catppuccin-mocha" y cambia solo lo que quieras.
[theme]
name = "Catppuccin Mocha"
dark = true

[theme.colors]
background = "#1e1e2e"
foreground = "#cdd6f4"
accent = "#89b4fa"
selection = "#313244"
muted = "#7f849c"
