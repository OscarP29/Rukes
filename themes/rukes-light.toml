# Tema incluido en Rukes. Copia este archivo a la carpeta "themes" de tu configuración para
# modificarlo, o crea uno nuevo con extends = "rukes-light" y cambia solo lo que quieras.
[theme]
name = "Rukes Claro"
dark = false

[theme.colors]
background = "#ffffff"       # bg
surface = "#f5f6f8"          # tarjetas y controles
surface_hover = "#eceef3"    # al pasar el ratón
border = "#dfe2e8"           # separadores y bordes
foreground = "#1c2030"       # text
muted = "#5b6475"            # text-muted
text_faint = "#8b93a3"       # etiquetas pequeñas
accent = "#3b6fe0"
accent_soft = "#3b6fe01f"    # fondos con acento
selection = "#e4ebfb"        # fila seleccionada
